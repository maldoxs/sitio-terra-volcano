name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build

      - uses: actions/configure-pages@v5

      # Vite copia public/ a dist/, así que los videos y la landing del
      # Villarrica (/villarrica/) se publican junto con la app.
      # Ojo: Pages NO resuelve punteros de Git LFS, así que los .mp4 tienen que
      # ir como objetos normales del repositorio.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
